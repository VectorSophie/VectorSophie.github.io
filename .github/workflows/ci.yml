name: Portfolio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:security
      # Known transitive high/moderate findings are tracked in SECURITY.md.
      - run: npm audit --omit=dev --audit-level=critical
      - name: Validate Compose and build the production image
        run: |
          docker compose --env-file deploy/environment.example -f docker-compose.yml -f docker-compose.https.yml config --quiet
          docker compose build nextjs
      - name: Start the real HTTP containers
        env:
          HTTP_PORT: 8080
        run: |
          docker compose up -d --wait --wait-timeout 120 nextjs nginx
          curl --fail --retry 5 --retry-delay 2 -I http://127.0.0.1:8080/
      - name: Verify container HTTPS with a disposable self-signed certificate
        run: sh tests/container-https-smoke.sh
      - name: Container logs
        if: failure()
        env:
          HTTP_PORT: 8080
        run: docker compose logs --no-color --tail=100
      - name: Stop containers
        if: always()
        env:
          HTTP_PORT: 8080
        run: docker compose down --volumes
