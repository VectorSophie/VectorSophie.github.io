services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    expose: ["3000"]
    volumes:
      - next-cache:/app/.next/cache
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    ports: ["${HTTP_PORT:-80}:8080"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      NGINX_ENVSUBST_FILTER: ^SITE_DOMAIN$
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates/http.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - acme-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /etc/nginx/conf.d:size=1m,uid=101,gid=101,mode=0755
    depends_on:
      nextjs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  certbot:
    image: certbot/certbot:v5.8.0
    profiles: [tools]
    cap_add: [CHOWN]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - acme-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - ./scripts/cert-permissions.sh:/hooks/cert-permissions.sh:ro
    logging: *logging

volumes:
  next-cache:
  acme-webroot:
  letsencrypt:
